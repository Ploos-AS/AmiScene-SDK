[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amiscene-sdk"
version = "0.1.0"
description = "ASM-first Amiga demoscene SDK host tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ploos AS"}]
dependencies = []

[project.optional-dependencies]
png = ["Pillow>=10"]
dev = ["Pillow>=10"]

[project.scripts]
amiscene = "amiscene.cli:main"

[tool.setuptools]
package-dir = {"" = "host"}

[tool.setuptools.packages.find]
where = ["host"]
