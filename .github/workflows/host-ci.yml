            -v "$PWD/m3-line-octant0-oracle-smoke-hunk:/payload:ro" \
            -v "$PWD/m3-line-octant0-oracle-smoke-runtime-evidence:/work/evidence" \
            amiga-runtime:m3-line-octant0-oracle-smoke \
            test-hunk /payload/amiscene-blit-line-octant0-oracle-smoke --profile a1200-020-aros
