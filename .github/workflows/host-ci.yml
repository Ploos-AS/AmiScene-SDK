name: Host CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: amiscene --version
      - run: amiscene table sine --entries 4 --amplitude 100 --label SinTable
      - run: amiscene copper examples/copper/bars.copper --check
      - run: amiscene copper examples/copper/bars.copper -o /tmp/bars.i --label CopperBars
      - run: grep -q '\$ffff,\$fffe' /tmp/bars.i

  m68k-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Build M2 reference with qualified amiga-dev
        run: |
          docker pull ghcr.io/ploos-as/amiga-dev:edge
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace/examples/asm \
            ghcr.io/ploos-as/amiga-dev:edge \
            amiga-build
      - name: Inspect m68k artifacts
        run: test -s examples/asm/build/amiscene-copper && test -s examples/asm/build/amiscene-copper-qualify && test -s examples/asm/build/amiscene-blit-qualify && test -s examples/asm/build/amiscene-blit-fill-qualify && test -s examples/asm/build/amiscene-blit-line-qualify && test -s examples/asm/build/amiscene-blit-line-octants-qualify
      - name: Upload M2 qualification Hunk
        uses: actions/upload-artifact@v4
        with:
          name: amiscene-m2-hunk
          path: examples/asm/build/amiscene-copper-qualify
          if-no-files-found: error
      - name: Upload M3 qualification Hunk
        uses: actions/upload-artifact@v4
        with:
          name: amiscene-m3-hunk
          path: examples/asm/build/amiscene-blit-qualify
          if-no-files-found: error
      - name: Upload M3 fill qualification Hunk
        uses: actions/upload-artifact@v4
        with:
          name: amiscene-m3-fill-hunk
          path: examples/asm/build/amiscene-blit-fill-qualify
          if-no-files-found: error
      - name: Upload M3 line qualification Hunk
        uses: actions/upload-artifact@v4
        with:
          name: amiscene-m3-line-hunk
          path: examples/asm/build/amiscene-blit-line-qualify
          if-no-files-found: error
      - name: Upload M3 octant-0 smoke Hunk
        uses: actions/upload-artifact@v4
        with:
          name: amiscene-m3-line-octant0-smoke-hunk
          path: examples/asm/build/amiscene-blit-line-octant0-smoke
          if-no-files-found: error
      - name: Upload M3 octant-0 AllocMem smoke Hunk
        uses: actions/upload-artifact@v4
        with:
          name: amiscene-m3-line-octant0-alloc-smoke-hunk
          path: examples/asm/build/amiscene-blit-line-octant0-alloc-smoke
          if-no-files-found: error
      - name: Upload M3 octant-0 oracle smoke Hunk
        uses: actions/upload-artifact@v4
        with:
          name: amiscene-m3-line-octant0-oracle-smoke-hunk
          path: examples/asm/build/amiscene-blit-line-octant0-oracle-smoke
          if-no-files-found: error
      - name: Upload M3 line octant qualification Hunks
        uses: actions/upload-artifact@v4
        with:
          name: amiscene-m3-line-octants-hunk
          path: |
            examples/asm/build/amiscene-blit-line-octants-qualify
            examples/asm/build/amiscene-blit-line-octant-*-qualify
          if-no-files-found: error

  amicopper-source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test AmiCopper parser and formatter round trips
        run: make -C amiga/amicopper test

  amicopper-native-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Build native AmiCopper with amiga-dev
        run: |
          docker pull ghcr.io/ploos-as/amiga-dev:edge
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace/amiga/amicopper ghcr.io/ploos-as/amiga-dev:edge make
      - name: Inspect native artifact
        run: test -s amiga/amicopper/build/AmiCopper
      - uses: actions/upload-artifact@v4
        with:
          name: amicopper-native-hunk
          path: amiga/amicopper/build/AmiCopper
          if-no-files-found: error

  m2-runtime:
    needs: m68k-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: amiscene-m2-hunk
          path: m2-hunk
      - uses: actions/checkout@v4
        with:
          repository: Ploos-AS/amiga-runtime
          ref: efa084177768e652f8ff1f43890415ee6bd64608
          path: amiga-runtime-src
      - name: Build qualified amiga-runtime
        run: docker build -t amiga-runtime:m2 amiga-runtime-src
      - name: Prepare AROS m68k runtime
        run: |
          mkdir -p "$PWD/aros-cache" "$PWD/m2-runtime-evidence"
          docker run --rm -v "$PWD/aros-cache:/opt/amiga-runtime/aros" amiga-runtime:m2 prepare-aros
      - name: Execute M2 qualification Hunk
        run: |
          chmod +x m2-hunk/amiscene-copper-qualify || true
          docker run --rm \
            -e AMIGA_RUNTIME_TIMEOUT=60 \
            -v "$PWD/aros-cache:/opt/amiga-runtime/aros" \
            -v "$PWD/m2-hunk:/payload:ro" \
            -v "$PWD/m2-runtime-evidence:/work/evidence" \
            amiga-runtime:m2 \
            test-hunk /payload/amiscene-copper-qualify --profile a1200-020-aros
          jq -e '.status == "PASS" and .runtime == "aros-hunk" and .profile == "a1200-020-aros" and .guest_payload_executed == true' m2-runtime-evidence/result.json
      - name: Upload M2 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amiscene-m2-runtime-evidence
          path: m2-runtime-evidence/
          if-no-files-found: warn

