          mkdir -p "$PWD/aros-cache" "$PWD/m3-line-octant-runtime-evidence"
          docker run --rm -v "$PWD/aros-cache:/opt/amiga-runtime/aros" amiga-runtime:m3-line-octant prepare-aros
      - name: Execute isolated M3 line octant ${{ matrix.octant }}
        run: |
          payload="m3-line-octants-hunk/amiscene-blit-line-octant-${{ matrix.octant }}-qualify"
          chmod +x "$payload" || true
          docker run --rm \
            -e AMIGA_RUNTIME_TIMEOUT=60 \
            -v "$PWD/aros-cache:/opt/amiga-runtime/aros" \
            -v "$PWD/m3-line-octants-hunk:/payload:ro" \
