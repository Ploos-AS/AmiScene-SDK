          ref: efa084177768e652f8ff1f43890415ee6bd64608
          path: amiga-runtime-src
      - name: Build qualified amiga-runtime
        run: docker build -t amiga-runtime:m3-line-octant0-smoke amiga-runtime-src
      - name: Prepare AROS m68k runtime
        run: |
          mkdir -p "$PWD/aros-cache" "$PWD/m3-line-octant0-smoke-runtime-evidence"
          docker run --rm -v "$PWD/aros-cache:/opt/amiga-runtime/aros" amiga-runtime:m3-line-octant0-smoke prepare-aros
