name: Host CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: amiscene --version
      - run: amiscene table sine --entries 4 --amplitude 100 --label SinTable
      - run: amiscene copper examples/copper/bars.copper --check
      - run: amiscene copper examples/copper/bars.copper -o /tmp/bars.i --label CopperBars
      - run: grep -q '\$ffff,\$fffe' /tmp/bars.i

  m68k-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Build M2 reference with qualified amiga-dev
        run: |
          docker pull ghcr.io/ploos-as/amiga-dev:edge
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace/examples/asm \
            ghcr.io/ploos-as/amiga-dev:edge \
            amiga-build
      - name: Inspect M2 artifacts
        run: test -s examples/asm/build/amiscene-copper && test -s examples/asm/build/amiscene-copper-qualify
      - name: Upload M2 qualification Hunk
        uses: actions/upload-artifact@v4
        with:
          name: amiscene-m2-hunk
          path: examples/asm/build/amiscene-copper-qualify
          if-no-files-found: error

  m2-runtime:
    needs: m68k-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: amiscene-m2-hunk
          path: m2-hunk
      - name: Pull qualified amiga-runtime
        run: docker pull ghcr.io/ploos-as/amiga-runtime:edge
      - name: Prepare AROS m68k runtime
        run: |
          mkdir -p "$PWD/aros-cache" "$PWD/m2-runtime-evidence"
          docker run --rm -v "$PWD/aros-cache:/opt/amiga-runtime/aros" ghcr.io/ploos-as/amiga-runtime:edge prepare-aros
      - name: Execute M2 qualification Hunk
        run: |
          chmod +x m2-hunk/amiscene-copper-qualify || true
          docker run --rm \
            -e AMIGA_RUNTIME_TIMEOUT=60 \
            -v "$PWD/aros-cache:/opt/amiga-runtime/aros:ro" \
            -v "$PWD/m2-hunk:/payload:ro" \
            -v "$PWD/m2-runtime-evidence:/work/evidence" \
            ghcr.io/ploos-as/amiga-runtime:edge \
            test-hunk /payload/amiscene-copper-qualify --profile amiga-ocs-68000-1m
          jq -e '.status == "PASS" and .runtime == "aros-hunk" and .profile == "amiga-ocs-68000-1m" and .guest_payload_executed == true' m2-runtime-evidence/result.json
      - name: Upload M2 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amiscene-m2-runtime-evidence
          path: m2-runtime-evidence/
          if-no-files-found: warn
