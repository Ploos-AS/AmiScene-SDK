name: Host CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: amiscene --version
      - run: amiscene table sine --entries 4 --amplitude 100 --label SinTable
      - run: amiscene copper examples/copper/bars.copper --check
      - run: amiscene copper examples/copper/bars.copper -o /tmp/bars.i --label CopperBars
      - run: grep -q '\$ffff,\$fffe' /tmp/bars.i

  m68k-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Build M2 reference with qualified amiga-dev
        run: |
          docker pull ghcr.io/ploos-as/amiga-dev:edge
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/examples/asm \
            ghcr.io/ploos-as/amiga-dev:edge \
            amiga-build
      - name: Inspect M2 artifact
        run: |
          test -s examples/asm/build/amiscene-copper
          file examples/asm/build/amiscene-copper
