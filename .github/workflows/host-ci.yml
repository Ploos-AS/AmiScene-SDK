          jq -e '.status == "PASS" and .runtime == "aros-hunk" and .profile == "a1200-020-aros" and .guest_payload_executed == true and .guest_rc == 0' m3-runtime-evidence/result.json
      - name: Upload M3 runtime evidence
        if: always()
