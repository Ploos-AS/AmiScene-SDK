  m3-line-octant-runtime:
    needs: m68k-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        octant: [0, 1, 2, 3, 4, 5, 6, 7]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: amiscene-m3-line-octants-hunk
          path: m3-line-octants-hunk
      - uses: actions/checkout@v4
